<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg border-0 rounded-4 login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-primary bg-gradient d-inline-flex align-items-center justify-content-center mb-3 user-icon">
          <i class="bi bi-person-fill text-white fs-3"></i>
        </div>
        <h2 class="fw-bold mb-1">Login</h2>
        <p class="text-muted mb-0">Access the voter dashboard</p>
      </div>

      <form (ngSubmit)="login()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input
            id="username"
            type="text"
            class="form-control form-control-lg"
            placeholder="Enter username"
            [(ngModel)]="username"
            name="username"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input
            id="password"
            type="password"
            class="form-control form-control-lg"
            placeholder="Enter password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
          Login
        </button>
      </form>
    </div>
  </div>
</div>
